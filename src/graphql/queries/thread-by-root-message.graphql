query ThreadByRootMessage($serverId: ID!, $conversationId: ID!, $rootMessageId: ID!) {
  threadByRootMessage(
    serverId: $serverId
    conversationId: $conversationId
    rootMessageId: $rootMessageId
  ) {
    id
    serverId
    conversationId
    rootMessageId
    rootAuthorId
    rootText
    createdAt
    lastMessageAt
  }
}
