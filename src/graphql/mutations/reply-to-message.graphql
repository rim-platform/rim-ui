mutation ReplyToMessage($input: ReplyToMessageInput!) {
  replyToMessage(input: $input) {
    id
    serverId
    conversationId
    threadId
    rootThreadId
    authorId
    author {
      id
      username
      displayName
      avatarUrl
    }
    text
    hasAttachments
    parentMessageId
    isDeleted
    sentAt
    reactions {
      emoji
      count
      reactedByMe
      userIds
    }
  }
}
