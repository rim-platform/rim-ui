name: CI Pipeline

on:
  pull_request:
  push:
    branches: ["master"]

# Read-only token for every job: none pushes, comments or publishes. Caches and the build
# artifact use the Actions runtime token, not this one.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  code_quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      # package.json, package-lock.json, src-tauri/Cargo.toml and Cargo.lock carry one version.
      - name: Version Check
        run: npm run version:check
      # No two tracked names in one folder differ only in case: Windows and macOS checkouts
      # cannot tell them apart, and an extensionless import picks the wrong module there.
      - name: Case Check
        run: npm run case:check
      # Production dependencies only: the dev toolchain (codegen, test runner) never ships.
      - name: Dependency Audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Format Check
        run: npm run format:check
      - name: Plugin SDK Type Check
        run: npm run sdk:typecheck
      # The SDK as npm would publish it: the files its tarball holds, and a copy of the template
      # plugin outside the repository that installs the tarball, type-checks, tests, runs and
      # bundles against it.
      - name: Plugin SDK Build
        run: npm run sdk:build
      - name: Plugin SDK Pack
        run: npm pack --dry-run --workspace sdk/plugin-sdk
      - name: Plugin SDK Smoke Test
        run: npm run sdk:smoke
      # Every Rust and npm production dependency under an accepted licence (src-tauri/about.toml);
      # cargo-about reads the crate tree with the runner's own cargo.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - name: Licence Check
        run: npm run licenses:check
      - name: Unit Tests
        run: npm test

  rust:
    name: Rust (src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      # Tauri's Linux build dependencies (webkit2gtk 4.1 pulls in gtk3 and libsoup3);
      # libssl-dev also serves the bundled SQLCipher in the message cache, and libdbus-1-dev
      # the keyring's Secret Service backend (src/secret_store.rs).
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The whole workspace: the app and the MLS crates under crates/, whose wasm facade also
      # builds and tests natively.
      - name: Format Check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The protocol conformance tests run the TypeScript plugins from source, which import the
      # plugin SDK by its package name: the workspace link npm ci makes, and the SDK's build.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Build the Plugin SDK
        working-directory: .
        run: |
          npm ci
          npm run sdk:build
      - name: Tests
        run: cargo test --workspace

  cargo_audit:
    name: Cargo Audit (src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binary: compiling cargo-audit from source takes minutes per run.
      - uses: taiki-e/install-action@cargo-audit
      # Blocking: allowed advisories, each with its justification, live in
      # src-tauri/.cargo/audit.toml.
      - name: Cargo Audit
        run: cargo audit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: rim-ui:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_GRAPHQL_ENDPOINT=http://localhost:8080/api
