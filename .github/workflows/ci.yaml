name: CI Pipeline

on:
  pull_request:
  push:
    branches: ["master"]

# Read-only token for every job: none pushes, comments or publishes. Caches and the build
# artifact use the Actions runtime token, not this one.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  code_quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      # Production dependencies only: the dev toolchain (codegen, test runner) never ships.
      - name: Dependency Audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Format Check
        run: npm run format:check
      - name: Plugin SDK Type Check
        run: npm run sdk:typecheck
      - name: Unit Tests
        run: npm test

  rust:
    name: Rust (src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # Tauri's Linux build dependencies (webkit2gtk 4.1 pulls in gtk3 and libsoup3);
      # libssl-dev also serves the bundled SQLCipher in the message cache, and libdbus-1-dev
      # the keyring's Secret Service backend (src/secret_store.rs).
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format Check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test

  cargo_audit:
    name: Cargo Audit (src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binary: compiling cargo-audit from source takes minutes per run.
      - uses: taiki-e/install-action@cargo-audit
      # Blocking: allowed advisories, each with its justification, live in
      # src-tauri/.cargo/audit.toml.
      - name: Cargo Audit
        run: cargo audit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [code_quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [code_quality]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: rim-ui:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_GRAPHQL_ENDPOINT=http://localhost:8080/api
