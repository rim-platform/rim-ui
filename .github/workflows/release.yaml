name: Release

# For a tag v<version>: builds, signs and publishes ghcr.io/rim-platform/rim-web, the web client
# image, builds the desktop installers, creates the GitHub release with the version's
# CHANGELOG.md section, the installers, the updater's latest.json and signed checksums. The
# plugin SDK is released on its own, by sdk-release.yaml. Only the maintainer may push v* tags.
# The image and desktop jobs wait together in the `release` environment, so one approval starts
# them all.
#
# A failed desktop leg is re-run from the run's page ("Re-run failed jobs"). The release is
# created as a draft and published only once every asset is attached, so a failure leaves at
# most a draft, which the re-run completes.
#
# Every action is pinned to a full commit SHA, with its version in a comment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rim-platform/rim-web

jobs:
  build-and-publish:
    name: Build and publish the image
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the package version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          package_version=$(jq -r .version package.json)
          if [[ $version != "$package_version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $package_version in package.json"
            exit 1
          fi
          # A pre-release gets only its own tags; <major.minor> and latest stay on the last release.
          tags="$IMAGE:$version"$'\n'"$IMAGE:sha-${GITHUB_SHA::7}"
          if [[ $version == *-* ]]; then
            prerelease=true
          else
            prerelease=false
            tags+=$'\n'"$IMAGE:${version%.*}"$'\n'"$IMAGE:latest"
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Before anything is pushed: a version without a changelog section is not released.
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section [$VERSION] with entries"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache: a release is built from the tagged sources alone, never from layers a
      # branch build left in the Actions cache. linux/amd64 only, like rim-server's image: the
      # web client alone is no use on a host the server image does not run on. The endpoint
      # `/api` is the page's own origin, so the image serves any domain.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_GRAPHQL_ENDPOINT=/api
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=rim-web
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      # A standalone SPDX file: it is attached to the GitHub release and attested to the image
      # below, so it can be read without a registry and checked against the digest.
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: rim-web-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # Keyless: the certificate names this workflow and the tag, issued for the job's OIDC token.
      - name: Sign the image and attest the SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM: rim-web-${{ steps.version.outputs.version }}.spdx.json
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate "$SBOM" "$IMAGE@$DIGEST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release-notes.md
            rim-web-${{ steps.version.outputs.version }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  # The desktop installers and their updater signatures, one leg per platform. A macOS leg is
  # one more entry: runner macos-latest, args "--target universal-apple-darwin", arch universal,
  # bundles ".dmg .app.tar.gz", plus the Apple signing and notarization secrets in its env.
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Linux builds in Debian Bookworm, so the binary needs no newer glibc and WebKitGTK than
    # Bookworm's (2.36, 4.1). An empty container runs the leg on the runner itself.
    container: ${{ matrix.container }}
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            container: debian:bookworm
            args: ""
            arch: x86_64
            bundles: .AppImage .deb .rpm
            notices: true
          - name: windows-x86_64
            runner: windows-latest
            container: ""
            args: ""
            arch: x86_64
            bundles: -setup.exe .msi
            notices: false
    defaults:
      run:
        shell: bash
    steps:
      # Before the long build: a release without the updater or the relay endpoint is not wanted,
      # and a private repository cannot serve the attestations or the updater's latest.json.
      - name: Check the build inputs
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_GRAPHQL_ENDPOINT: ${{ vars.RELEASE_GRAPHQL_ENDPOINT }}
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          UPDATER_ENDPOINT: ${{ vars.UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          if [[ $REPOSITORY_PRIVATE == true ]]; then
            echo "::error::the repository is private: build-provenance attestations and releases/latest/download (the updater endpoint) need it public; make it public before tagging"
            missing=1
          fi
          for name in RELEASE_GRAPHQL_ENDPOINT UPDATER_PUBKEY UPDATER_ENDPOINT \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z ${!name} ]]; then
              echo "::error::$name is empty: set it in the repository's variables or the release environment's secrets (docs/updater.md)"
              missing=1
            fi
          done
          exit "$missing"

      # Tauri's Linux build dependencies (webkit2gtk 4.1 pulls in gtk3 and libsoup3); libssl-dev
      # also serves the bundled SQLCipher and libdbus-1-dev the keyring's Secret Service backend.
      # git and curl come first: checkout, the Rust toolchain and the AppImage tools need them.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git pkg-config wget xdg-utils patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libdbus-1-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # The licence notices bundled with the app are generated with cargo-about; a release
      # build refuses to compile without them.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2

      - name: Install the dependencies
        run: npm ci

      - name: Check the version
        run: |
          npm run version:check
          version=$(node -p 'require("./package.json").version')
          if [[ ${GITHUB_REF_NAME#v} != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      - name: Write the third-party licence notices
        run: npm run licenses

      # The committed updater.json is empty, so development builds never contact an update host.
      - name: Configure the updater
        env:
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          UPDATER_ENDPOINT: ${{ vars.UPDATER_ENDPOINT }}
        run: |
          node -e '
            const { writeFileSync } = require("node:fs");
            const file = { endpoints: [process.env.UPDATER_ENDPOINT], pubkey: process.env.UPDATER_PUBKEY };
            writeFileSync("src-tauri/updater.json", JSON.stringify(file, null, 2) + "\n");
          '

      # The overlay turns on the updater signatures; the bundler also wants the public key, and
      # refuses a private key that does not match it. It is a file, not inline JSON, so Windows'
      # npm script shell cannot mangle its quotes. Stale bundles from a cached target directory
      # are removed first.
      - name: Build the installers
        env:
          VITE_GRAPHQL_ENDPOINT: ${{ vars.RELEASE_GRAPHQL_ENDPOINT }}
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_ARGS: ${{ matrix.args }}
        run: |
          rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle
          overlay="$RUNNER_TEMP/updater-artifacts.json"
          node -e '
            const overlay = {
              bundle: { createUpdaterArtifacts: true },
              plugins: { updater: { pubkey: process.env.UPDATER_PUBKEY } },
            };
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(overlay));
          ' "$overlay"
          # shellcheck disable=SC2086 # TAURI_ARGS holds separate arguments.
          npm run tauri build -- --config src-tauri/tauri.release.conf.json --config "$overlay" \
            $TAURI_ARGS

      # Only the installers and their updater signatures, each expected type present, and from
      # the leg marked `notices` the licence notices the release attaches.
      - name: Collect the bundles
        env:
          ARCH: ${{ matrix.arch }}
          BUNDLES: ${{ matrix.bundles }}
          NOTICES: ${{ matrix.notices }}
        run: |
          shopt -s nullglob
          version=$(node -p 'require("./package.json").version')
          mkdir release-bundles
          dirs=(src-tauri/target/release/bundle src-tauri/target/*/release/bundle)
          for suffix in $BUNDLES; do
            files=()
            for dir in "${dirs[@]}"; do
              files+=("$dir"/*/*"$suffix")
            done
            if (( ${#files[@]} == 0 )); then
              echo "::error::the build wrote no $suffix bundle"
              exit 1
            fi
            for file in "${files[@]}"; do
              name=$(basename "$file")
              # The macOS update archive carries no version or architecture in its name.
              if [[ $suffix == .app.tar.gz ]]; then
                name="${name%.app.tar.gz}_${version}_${ARCH}.app.tar.gz"
              fi
              cp "$file" "release-bundles/$name"
              if [[ -f $file.sig ]]; then
                cp "$file.sig" "release-bundles/$name.sig"
              fi
            done
          done
          if [[ $NOTICES == true ]]; then
            cp src-tauri/resources/THIRD-PARTY-LICENSES.txt release-bundles/
          fi
          ls -l release-bundles

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: release-bundles/
          if-no-files-found: error
          retention-days: 7

  # A job of its own: creating a release needs contents: write, which the job holding the
  # package and signing grants does not get.
  github-release:
    name: Create the GitHub release
    needs: [build-and-publish, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build-and-publish.outputs.version }}
      PRERELEASE: ${{ needs.build-and-publish.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: bundles
          merge-multiple: true

      # A draft is not public and `releases/latest` skips it, so the updater sees nothing until
      # the last step publishes it. A re-run finds the draft and fills it.
      - name: Create the draft release
        env:
          DIGEST: ${{ needs.build-and-publish.outputs.digest }}
        run: |
          cat >> release-notes.md <<EOF

          ### Image

          \`$IMAGE:$VERSION\` (\`$DIGEST\`), signed with cosign by this repository's release
          workflow. Verify it:

          \`\`\`sh
          cosign verify $IMAGE:$VERSION \\
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yaml@refs/tags/v$VERSION" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [[ $draft == false ]]; then
            echo "::error::release $GITHUB_REF_NAME is already published"
            exit 1
          fi
          if [[ $draft == none ]]; then
            flags=()
            if [[ $PRERELEASE == true ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "RIM $VERSION" --notes-file release-notes.md "${flags[@]}"
          fi

      # SHA256SUMS covers the installers and THIRD-PARTY-LICENSES.txt.
      - name: Write latest.json and SHA256SUMS
        run: node scripts/release-assets.mjs bundles "$VERSION" "$GITHUB_REPOSITORY" > downloads.md

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # Keyless, like the image: the certificate names this workflow and the tag.
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle bundles/SHA256SUMS.sigstore.json bundles/SHA256SUMS

      # SLSA build provenance for every file SHA256SUMS lists.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: bundles/SHA256SUMS

      - name: Upload the assets
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            bundles/* "rim-web-$VERSION.spdx.json"

      - name: Publish the release
        run: |
          {
            printf '\n### Desktop app\n\n'
            cat downloads.md
            cat <<EOF

          Whichever you install, the app offers later releases in Settings, About; with the
          \`.deb\` or the \`.rpm\` an update asks for an administrator password.

          Windows: SmartScreen shows an unknown publisher until the installer is signed; choose
          More info, then Run anyway.

          The third-party licence notices the app bundles are attached as
          \`THIRD-PARTY-LICENSES.txt\`.

          ### Verify the downloads

          \`SHA256SUMS\` lists every installer and \`THIRD-PARTY-LICENSES.txt\`. It is signed with
          cosign by this repository's release workflow, and each file it lists has a build
          provenance attestation. Next to the downloaded files:

          \`\`\`sh
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yaml@refs/tags/v$VERSION \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify <file> --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF
          } >> release-notes.md
          flags=(--draft=false)
          if [[ $PRERELEASE != true ]]; then
            flags+=(--latest)
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md "${flags[@]}"
