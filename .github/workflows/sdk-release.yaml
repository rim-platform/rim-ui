name: SDK release

# For a tag plugin-sdk-v<version>: publishes @rim-platform/plugin-sdk to npm at that version.
# The SDK keeps a version of its own and is released apart from the app, so an SDK release
# needs no app release and an app release publishes no SDK. Only the maintainer may push
# plugin-sdk-v* tags, and the job waits for the maintainer's approval in the `npm`
# environment. npm trusts this workflow and environment as the package's publisher
# (docs/release-sdk.md): no token is stored, and the provenance npm records names this run.
#
# Every action is pinned to a full commit SHA, with its version in a comment.

on:
  push:
    tags: ["plugin-sdk-v*"]

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the plugin SDK
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # The whole history, to check that the tagged commit is on master.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # The tag names the version: it must be the one in sdk/plugin-sdk/package.json, and the
      # tagged commit must be on master. A version npm already has publishes nothing, so
      # "Re-run failed jobs" is safe after a publish that went through.
      - name: Check the tag and the SDK version
        id: sdk
        run: |
          name=$(jq -r .name sdk/plugin-sdk/package.json)
          version=$(jq -r .version sdk/plugin-sdk/package.json)
          if ! [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version $version in sdk/plugin-sdk/package.json is not <major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          if [[ $GITHUB_REF_NAME != "plugin-sdk-v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the SDK version $version; the tag is plugin-sdk-v$version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on master"
            exit 1
          fi
          # npm answers a version it does not have with nothing or with E404, depending on its
          # version; only an answer naming the version counts as published.
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [[ $published == "$version" ]]; then
            echo "::notice::$name@$version is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Trusted publishing needs npm 11.5.1 or newer, newer than Node 22 ships.
      - name: Install the dependencies
        if: steps.sdk.outputs.publish == 'true'
        run: |
          npm ci
          npm install --global npm@11.21.0

      # The build, then the tarball installed into a copy of the template plugin outside the
      # repository: what is about to be published, used as a plugin would use it.
      - name: Build and smoke-test the SDK
        if: steps.sdk.outputs.publish == 'true'
        run: |
          npm run sdk:build
          npm run sdk:smoke

      # A pre-release goes out under the dist-tag `next`, so `npm install` keeps the last release.
      - name: Publish to npm
        if: steps.sdk.outputs.publish == 'true'
        working-directory: sdk/plugin-sdk
        env:
          VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          flags=(--provenance --access public)
          if [[ $VERSION == *-* ]]; then
            flags+=(--tag next)
          fi
          npm publish "${flags[@]}"
