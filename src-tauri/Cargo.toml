[package]
name = "rim-ui"
version = "0.0.9"
description = "RIM desktop app: a programmable communication workspace"
authors = ["Jakub Dvořák"]
edition = "2021"
license = "Apache-2.0"
homepage = "https://github.com/rim-platform/rim-ui"
repository = "https://github.com/rim-platform/rim-ui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["crates/*"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rim_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "7"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros", "net"] }
log = "0.4"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
# HTTP to servers and cloud archives. reqwest's defaults without its rustls and aws-lc-rs TLS:
# native TLS (OpenSSL on Linux, the OS stack on macOS and Windows), as the WebSocket client
# below uses. `form` and `query` provide `RequestBuilder::form` and `::query`.
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "stream",
    "blocking",
    "form",
    "query",
] }
futures-util = "0.3"
# Direct connections to another server (src/relay/direct.rs): a WebSocket carrying that
# server's session cookie, which the webview's own socket cannot.
tokio-tungstenite = { version = "0.26.2", features = ["native-tls"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# In-app updates and the relaunch that applies them. Kept on the same minor as their npm
# packages and on lines that build against the tauri minor in use.
tauri-plugin-updater = "~2.14.0"
tauri-plugin-process = "~2.4.0"
# The app's log file in the OS log directory, with rotation; the webview's warnings and errors
# reach it through the npm package of the same version.
tauri-plugin-log = "=2.10.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
getrandom = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v7"] }
zeroize = { version = "1", features = ["derive", "serde"] }
sha2 = "0.10"
hex = "0.4"
# Local message cache (src/message_cache): SQLCipher, so the whole database file is encrypted.
# macOS links CommonCrypto and Linux the system libcrypto; Windows has no system OpenSSL, so
# it builds a vendored one (see the target section below).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
# History archive (src/history_archive): XChaCha20-Poly1305 seals the archive files, Argon2id
# turns the passphrase into a key, HKDF and HMAC derive subkeys and the account folder name.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
# Key identity (src/key_identity): Ed25519 device, identity and recovery keys.
ed25519-dalek = "3"
# The recovery phrase (src/key_identity/recovery_kit.rs): the BIP39 English word list and its
# checksum. Only the word encoding is used; the key comes from HKDF, not BIP39's PBKDF2 seed.
bip39 = { version = "2.2", default-features = false, features = ["zeroize"] }
# Device linking (src/key_identity/device_link.rs): AES-256-GCM seals the offer and the answer,
# as WebCrypto can on the web client (no ChaCha20 there).
aes-gcm = "0.10"
# End-to-end encryption (crates/rim_mls): MLS groups for DMs and private groups.
rim_mls = { path = "crates/rim_mls" }
# The account password (src/account_lock): OPAQUE and the wraps of each account's data key.
rim_opaque = { path = "crates/rim_opaque" }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
# Validates frames against protocol/plugin-protocol-v1.schema.json in the conformance tests.
jsonschema = { version = "0.58", default-features = false }
# A small blocking HTTP server: the fake Google Drive and Dropbox the archive's cloud providers
# are tested against.
tiny_http = "0.12"
# The OPAQUE server the account lock's tests sign in against.
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255", "argon2"] }
rand_core = { version = "0.6", features = ["getrandom"] }


# The browser build of `rim_mls` (`crates/rim_mls_wasm`, `npm run build:wasm`): smaller than
# `release`, which the desktop app keeps.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# The signup proof-of-work (src/relay/pow.rs) hashes millions of times: optimized even in
# development builds, so a signup there takes seconds, not minutes.
[profile.dev.package.sha2]
opt-level = 3

# Argon2id at the account password's cost (64 MiB, 3 passes, crates/rim_opaque) takes many
# seconds unoptimized: optimized in development and test builds too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
