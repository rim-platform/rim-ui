[package]
name = "rim-ui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rim_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-stronghold = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
log = "0.4"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
getrandom = "0.3"
base64 = "0.22"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive", "serde"] }
sha2 = "0.10"
hex = "0.4"
# Local message cache (src/message_cache): SQLCipher, so the whole database file is encrypted.
# macOS links CommonCrypto and Linux the system libcrypto; Windows has no system OpenSSL, so
# it builds a vendored one (see the target section below).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
# Validates frames against protocol/plugin-protocol-v1.schema.json in the conformance tests.
jsonschema = { version = "0.58", default-features = false }

