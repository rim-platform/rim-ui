# Configuration for `cargo audit` (https://github.com/rustsec/rustsec), run from `src-tauri/`.
#
# The three advisories below are in the libcrux crates that `openmls_libcrux_crypto` 0.4.0, the
# MLS provider of `crates/rim_mls`, links. Unlike on the server they are compiled into the
# desktop app and the web MLS module. No fix is reachable: 0.4.0 is the newest
# `openmls_libcrux_crypto`, it requires `libcrux-hmac-drbg` 0.0.1 and `hpke-rs-libcrux` 0.7,
# and `hpke-rs-libcrux` 0.7 pins `libcrux-kem` `=0.0.9`. All three go once an
# `openmls_libcrux_crypto` release moves to `hpke-rs` 0.8 and `libcrux-hmac-drbg` 0.0.2;
# `rim_mls` pins it exactly, so that upgrade is its own change.
#
# RUSTSEC-2026-0329 — `HmacDrbgRng::fill_bytes` in `libcrux-hmac-drbg` 0.0.1 panics on an
# output length that is a non-zero multiple of 65,536. Compiled, but the affected function is
# never called: `openmls_libcrux_crypto` draws randomness through the fallible `HmacDrbg`
# (`generate`, in chunks of at most `MAX_GENERATE_BYTES`), and nothing in the dependency
# graph or this workspace uses `HmacDrbgRng`.
#
# RUSTSEC-2026-0330 — `PublicKey::encapsulate_derand` in `libcrux-kem` 0.0.9 panics on a seed
# shorter than 32 bytes. Compiled, but never called: `hpke-rs-libcrux` encapsulates with
# `PublicKey::encapsulate`, which draws its own seed from the provider's RNG, and neither
# OpenMLS, `hpke-rs` nor this workspace calls `encapsulate_derand`.
#
# RUSTSEC-2026-0331 — `PublicKey::decode` / `PrivateKey::decode` in `libcrux-kem` 0.0.9 panic
# on a hybrid key shorter than its type. The groups use X-Wing
# (MLS_128_MLKEM768X25519_AES128GCM_SHA256_Ed25519), and HPKE encryption to another device
# decodes that device's X-Wing public key, which panics below 1,184 bytes (the ML-KEM-768 part).
# Neither OpenMLS's key package and leaf node validation nor the server checks the length, so
# `rim_mls` does (`crates/rim_mls/src/peer_key.rs`), requiring exactly 1,216 bytes: the init key
# and leaf encryption key of every key package an Add uses, and every key this device's own
# Commit could encrypt to, before OpenMLS builds the Commit (`Error::InvalidPeerKey`); every key
# in the tree an incoming Commit produces (not merged; the group waits for a re-add) and in the
# tree of a Welcome (refused). OpenMLS encrypts to another device's key only when this device
# builds a Commit and its Welcome, so no path that reaches the panic remains. The advisory stays
# allowed because the crate is still linked: a new operation that encrypts to another device's
# key (an external commit, a proposal by reference) needs the same check. Private keys are always
# this device's own, and the X-Wing private key decode does not panic.
# The three advisories below are in `zip` 4.6.1, which `tauri-plugin-updater` 2.13.2 (and 2.14.0)
# requires as `^4`; the fix is `zip` 9, which no updater release takes yet. The plugin uses
# `zip` for one thing: unpacking the Windows update archive (`ZipArchive::extract` in its
# `install_inner`). It extracts only bytes it has already verified against this app's updater
# public key (`verify_signature` in `download`, before `install`), so a hostile archive (links
# out of the destination, modes through links, SUID bits) needs the maintainer's signing key.
# Linux installs AppImage and `.deb`/`.rpm` without `zip`. Drop these once the updater depends on
# `zip` 9 (rim-ui issue tracks it).
#
# RUSTSEC-2026-0367 — SUID/SGID bits preserved on extraction.
# RUSTSEC-2026-0368 — symbolic links with targets outside the destination directory.
# RUSTSEC-2026-0369 — Unix permissions applied through symlinks without confining the target.
#
# RUSTSEC-2026-0387 — timing variability in `crypto-bigint` 0.5.5 operations meant to be
# constant-time. The crate comes only through `elliptic-curve` 0.13 (`p256`, `p384`) of
# `openmls_rust_crypto` 0.6, which is a dev-dependency of `crates/rim_mls`: its tests use it as
# a second MLS provider. It is in neither the desktop app nor the web MLS module (`cargo tree
# -e normal,build -i crypto-bigint` is empty for every target). The fix, `crypto-bigint` 0.7,
# needs `elliptic-curve` 0.14, which no `openmls_rust_crypto` release uses yet. Drop this once
# it does, or once `rim_mls` tests no longer use that provider.
[advisories]
ignore = [
    "RUSTSEC-2026-0329",
    "RUSTSEC-2026-0330",
    "RUSTSEC-2026-0331",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0387",
]
