# Licences cargo-about accepts for the desktop app's Rust dependencies; `npm run licenses`
# fails on any other.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "MPL-2.0",
  "OpenSSL",
  # The Mozilla root certificates in webpki-root-certs.
  "CDLA-Permissive-2.0",
]
# Test-only crates never ship.
ignore-dev-dependencies = true
# The desktop platforms and the web app's encryption module.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "wasm32-unknown-unknown",
]
