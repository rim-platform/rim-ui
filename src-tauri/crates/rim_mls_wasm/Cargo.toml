[package]
name = "rim_mls_wasm"
version = "0.1.0"
description = "rim_mls for the browser: the web app's MLS engine, over bytes and JSON"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
# `cdylib` is the WebAssembly module; `rlib` lets the workspace's native tests and clippy build it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Group state in memory, written through to IndexedDB by the web app: no SQLite.
rim_mls = { path = "../rim_mls", default-features = false }
wasm-bindgen = "=0.2.114"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = "1"
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "3"
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
uuid = { version = "1", features = ["js"] }
