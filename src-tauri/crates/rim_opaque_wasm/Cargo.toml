[package]
name = "rim_opaque_wasm"
version = "0.1.0"
description = "rim_opaque for the browser: the web app's account password check, over bytes"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
# `cdylib` is the WebAssembly module; `rlib` lets the workspace's native tests and clippy build it.
crate-type = ["cdylib", "rlib"]

[dependencies]
rim_opaque = { path = "../rim_opaque" }
wasm-bindgen = "=0.2.114"
js-sys = "0.3"
zeroize = "1"

# Randomness from WebCrypto.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255", "argon2"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
