[package]
name = "rim_mls"
version = "0.1.0"
description = "End-to-end encryption for RIM DMs and groups: MLS (RFC 9420) behind RIM's own types"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = ["sqlite"]
# Group state in SQLite (the desktop's cache database). The web build keeps it in memory.
sqlite = ["dep:rusqlite"]

[dependencies]
# Exact pins: group state written by one release must load in the next, so every upgrade is its
# own change that reruns the storage and vector tests.
openmls = "=0.9.1"
# The post-quantum suites are enabled on the traits and the provider, not on `openmls`: its
# feature also names `openmls_sqlite_storage?/…`, which makes cargo count that crate's `rusqlite`
# 0.37 in the `links = "sqlite3"` check against the app's `rusqlite` 0.40.
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
uuid = "1"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3"
chrono = "0.4"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.13"
aes-gcm = "0.10"
ed25519-dalek = "2"

# The browser build: OpenMLS reads the clock through `web-time`, and randomness comes from
# WebCrypto.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"], optional = true }

[dev-dependencies]
# The named fallback provider, and the second implementation the cross-provider tests compare.
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
# The HPKE and KEM backends the two providers link, driven directly by the known-answer tests.
hpke-rs-crypto = "=0.7.0"
hpke-rs-libcrux = "=0.7.0"
hpke-rs-rust-crypto = { version = "=0.7.0", features = ["experimental"] }
libcrux-ml-kem = "=0.0.10"
ml-kem = { version = "=0.3.2", features = ["hazmat"] }
hex = "0.4"
uuid = { version = "1", features = ["v4", "v7"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The test suite in a headless browser (see `docs/e2ee-web.md`).
wasm-bindgen-test = "0.3"
uuid = { version = "1", features = ["js"] }
