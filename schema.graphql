"""
Input for `signupWithKey`: an account created from a key identity alone, with no password
and no email. The tokens follow the same rules as `signupWithInvite`: exactly one in
invite-only mode, none in open mode.
"""
input SignupWithKeyInput {
	username: String!
	"""
	Optional display name (1–80 chars when present). Falls back to `username` when absent
	or blank after trim.
	"""
	displayName: String
	"""
	The whole key log, inception first.
	"""
	keyLog: [SignedStatementInput!]!
	"""
	Certificate of the device signing up; the new session belongs to it.
	"""
	device: SignedStatementInput!
	"""
	A `login` statement signed by that device over a fresh `keyLoginChallenge`.
	"""
	proof: SignedStatementInput!
	bootstrapToken: String
	instanceInviteToken: String
	workspaceInviteToken: String
}

type SkillProfileGql {
	userId: ID!
	featuresUsed: [FeatureUsage!]!
	skillTier: SkillTier!
}

enum SkillTier {
	BEGINNER
	INTERMEDIATE
	ADVANCED
}

input StartIncidentInput {
	serverId: ID!
	conversationId: ID!
	title: String!
	severity: IncidentSeverityGql
	"""
	Overrides the conversation's default escalation policy (`setChannelEscalationPolicy`) for
	just this incident (§3/§10). `None` falls back to that default (or no escalation chain at
	all if none is set).
	"""
	escalationPolicyId: ID
}

type StartedDeviceLink {
	"""
	16 bytes, unpadded base64url. The server keeps only its hash, so it is shown once.
	"""
	linkId: String!
	expiresAt: DateTime!
}

type Subscription {
	"""
	Subscribe to all real-time events for a workspace.
	Returns events as JSON strings — the client parses the `type` field to determine the event kind.
	"""
	workspaceEvents(workspaceId: ID!): String!
}

input TagIncidentMessageInput {
	incidentId: ID!
	messageId: ID!
	tagType: MessageTagTypeGql
}

type Thread {
	id: ID!
	serverId: ID!
	conversationId: ID!
	rootMessageId: ID
	rootAuthorId: ID
	rootText: String
	createdAt: DateTime!
	lastMessageAt: DateTime!
}

input ThreadCursorInput {
	lastMessageAt: DateTime!
	threadId: ID!
}

type ThreadCursorOutput {
	lastMessageAt: DateTime!
	threadId: ID!
}

type ThreadPage {
	items: [Thread!]!
	next: ThreadCursorOutput
	prev: ThreadCursorOutput
	pageInfo: PageInfo!
}

input ToggleReactionInput {
	serverId: ID!
	conversationId: ID!
	messageId: ID!
	emoji: String!
}

enum TypedVerbGql {
	READ
	WRITE
	DELETE
	SEND
	OPEN
	CLOSE
	TOGGLE
	NAVIGATE
	EXECUTE
	CONFIGURE
	OTHER
}

input UnmuteConversationInput {
	serverId: ID!
	conversationId: ID!
}

input UnpinMessageInput {
	serverId: ID!
	conversationId: ID!
	messageId: ID!
}

type UnreadCount {
	conversationId: ID!
	count: Int!
}

input UpdateChannelLensInput {
	serverId: ID!
	lensId: ID!
	name: String
	filterSpec: FilterSpecInput
	isShared: Boolean
}

input UpdateConversationTopicInput {
	serverId: ID!
	conversationId: ID!
	topic: String
}

input UpdateIncidentStatusInput {
	incidentId: ID!
	status: IncidentStatusGql!
}

input UpdateKeybindInput {
	keybindId: ID!
	keystroke: String!
	commandId: String!
	context: KeybindContext!
	presetArgs: JSON
	isEnabled: Boolean!
}

input UpdateMacroInput {
	macroId: ID!
	name: String!
	description: String
	steps: [MacroStepInput!]!
	aiCallable: Boolean! = false
	nlDescription: String! = ""
	intentSamples: [String!]! = []
	sensitivity: CommandSensitivity! = SAFE
}

"""
Patch fields on the authenticated user's profile.

Each field is independently optional. Omitting a field leaves the existing
value unchanged. Sending an explicit empty string clears the field
(after trim + control-char strip).
"""
input UpdateMyProfileInput {
	displayName: String
	avatarUrl: String
	statusText: String
	bio: String
}

"""
Replaces the editable settings (the manual pause is separate: `setDoNotDisturb`).
"""
input UpdateNotificationSettingsInput {
	defaultLevel: NotificationLevel!
	"""
	At most 20, each 2 to 40 characters; stored lower-cased and deduplicated.
	"""
	keywords: [String!]!
	"""
	Null turns the daily window off.
	"""
	dnd: DndWindowInput
	digest: DigestFrequency!
}

input UpdatePipelineInput {
	pipelineId: ID!
	name: String!
	description: String
	trigger: PipelineTriggerInput!
	filter: PipelineFilterInput
	actions: [PipelineActionInput!]!
	cooldownSecs: Int
}

input UpdateUserCommandInput {
	commandId: String!
	title: String!
	description: String!
	steps: [UserCommandStepInput!]!
	isEnabled: Boolean!
}

type UploadTicket {
	attachmentId: ID!
	uploadToken: String!
	maxSizeBytes: Int
	expiresAt: DateTime
}

type User {
	id: ID!
	username: String!
	displayName: String
	avatarUrl: String
	statusText: String
	bio: String
	"""
	Key-based principal id (`rimp1_...`) once the account enrolled a key; null before. Plugins
	see this id, and the host maps a provisional `rimp0_` id to it once
	(`docs/specs/key-identity-v1.md`).
	"""
	principalId: String
}

input UserCommandStepInput {
	commandId: String!
	args: JSON
}

type UserPresenceGql {
	userId: ID!
	status: PresenceStatus!
	lastSeenAt: DateTime!
}

"""
An optional workspace module (Track 0.4). `INCIDENTS` covers incidents, on-call schedules,
escalation policies and alert ingestion together.
"""
enum WorkspaceFeature {
	INCIDENTS
}

"""
Whether one optional module is on for one workspace. `updatedAt` is null when the value is
the feature's default (never explicitly set for this workspace).
"""
type WorkspaceFeatureState {
	feature: WorkspaceFeature!
	enabled: Boolean!
	updatedAt: DateTime
}

"""
Minimal workspace info included in a workspace-invite preview.

See spec §4.7 — inviter name and server name are disclosed because
the user was already shown them on the invite-link landing page.
"""
type WorkspaceInvitePreviewGql {
	serverId: ID!
	serverName: String!
	invitedByDisplayName: String!
}

type WorkspaceStateEntryGql {
	id: ID!
	serverId: ID!
	key: String!
	value: JSON!
	scope: WorkspaceStateScopeGql!
	userId: ID
	version: Int!
	expiresAt: DateTime
	createdAt: DateTime!
	updatedAt: DateTime!
}

enum WorkspaceStateScopeGql {
	SERVER
	USER
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}
