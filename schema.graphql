	dir: PageDir
}

type SearchResultMessage {
	id: ID!
	serverId: ID!
	conversationId: ID!
	conversationTitle: String
	conversationType: ConversationTypeEnum!
	threadId: ID
	rootMessageId: ID
	authorId: ID!
	text: String
