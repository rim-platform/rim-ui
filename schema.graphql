	text: String
	hasAttachments: Boolean!
	attachments: [Attachment!]!
	parentMessageId: ID
	forwardedFromMessageId: ID
	"""
	The forwarded message; null when the viewer cannot read its conversation or it is gone.
	"""
	forwardedFrom: Message
