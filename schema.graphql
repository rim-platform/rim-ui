The type of a command argument. Clients map each value to a form control and to a JSON
schema fragment when they describe the command to an AI agent.
"""
enum CommandArgumentType {
	STRING
	INTEGER
	FLOAT
	BOOLEAN
	ENUM
	USER_ID
	CONVERSATION_ID
	MESSAGE_ID
	THREAD_ID
	WORKSPACE_ID
	SELECTION_TEXT
}

